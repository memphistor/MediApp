name: Mobile CI

on:
  push:
    branches: [mobile]
  pull_request:
    branches: [mobile]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test @mediapp/core
        run: npm run test:core

      - name: Typecheck mobile app
        run: npm run lint -w mediapp-mobile
